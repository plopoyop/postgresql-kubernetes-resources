name: example-postgresql
teamId: "acid"
numberOfInstances: 2
version: "17"

# Manifest users. Names listed in the operator's `protected_role_names`
# ("admin" and "cron_admin" by default) cannot be used here: the operator refuses
# to create them and silently skips the databases they own.
users:
  app_admin:
    - superuser
    - createdb

databases:
  app: app_admin

preparedDatabases: {}
#  bar:
#    defaultUsers: true
#    extensions:
#      pg_partman: public
#      pgcrypto: public
#    schemas:
#      data: {}
#      history:
#        defaultRoles: true
#        defaultUsers: false

postgresql:
  parameters: {}
#    shared_buffers: "32MB"
#    max_connections: "100"
#    log_statement: "all"

volume:
  size: 1Gi
#  storageClass: ""
#  type: "ebs"
#  iops: 1000
#  throughput: 250

additionalVolumes: []
#  - name: empty
#    mountPath: /opt/empty
#    targetContainers:
#      - all
#    volumeSource:
#      emptyDir: {}

enableShmVolume: true

resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    cpu: 500m
    memory: 500Mi

patroni:
  failsafe_mode: false
  initdb:
    encoding: "UTF8"
    locale: "en_US.UTF-8"
    data-checksums: "true"
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  synchronous_mode: false
  synchronous_mode_strict: false
  synchronous_node_count: 1
  maximum_lag_on_failover: 33554432
#  pg_hba: []
#  slots: {}

enableMasterLoadBalancer: false
enableReplicaLoadBalancer: false

enableConnectionPooler: false
enableReplicaConnectionPooler: false
enableMasterPoolerLoadBalancer: false
enableReplicaPoolerLoadBalancer: false

# NodePort services. These override the load balancer configuration above.
# Leave the port values unset to let Kubernetes pick a port.
enableMasterNodePort: false
enableReplicaNodePort: false
enableMasterPoolerNodePort: false
enableReplicaPoolerNodePort: false
#masterNodePort: 30000
#replicaNodePort: 30001
#masterPoolerNodePort: 30002
#replicaPoolerNodePort: 30003

connectionPooler: {}
#  numberOfInstances: 2
#  mode: "transaction"
#  schema: "pooler"
#  user: "pooler"
#  maxDBConnections: 60
#  resources:
#    requests:
#      cpu: 300m
#      memory: 100Mi
#    limits:
#      cpu: "1"
#      memory: 100Mi

allowedSourceRanges: []
#  - 127.0.0.1/32

tls:
  secretName: ""
  certificateFile: "tls.crt"
  privateKeyFile: "tls.key"
  caFile: ""
  caSecretName: ""

enableLogicalBackup: false
logicalBackupSchedule: "30 00 * * *"
#logicalBackupRetention: "3 months"

initContainers: []
#  - name: date
#    image: busybox
#    command: [ "/bin/date" ]

sidecars: []
#  - name: "telegraf-sidecar"
#    image: "telegraf:latest"
#    ports:
#      - name: metrics
#        containerPort: 8094
#        protocol: TCP
#    resources:
#      limits:
#        cpu: 500m
#        memory: 500Mi
#      requests:
#        cpu: 100m
#        memory: 100Mi

podAnnotations: {}
serviceAnnotations: {}
podPriorityClassName: ""
tolerations: []
nodeAffinity: {}

topologySpreadConstraints: []
#  - maxSkew: 1
#    topologyKey: topology.kubernetes.io/zone
#    whenUnsatisfiable: ScheduleAnyway
#    labelSelector:
#      matchLabels:
#        application: spilo

# Overrides the operator's global liveness_probe for this cluster
livenessProbe: {}
#  httpGet:
#    scheme: HTTP
#    path: /liveness
#    port: 8008
#  initialDelaySeconds: 10
#  periodSeconds: 10
#  timeoutSeconds: 5
#  successThreshold: 1
#  failureThreshold: 3

# Stream from a remote primary or from an S3/GCS WAL archive.
# Requires one of s3_wal_path, gs_wal_path or standby_host;
# s3_wal_path and gs_wal_path are mutually exclusive.
standby: {}
#  standby_host: "acid-minimal-cluster.default"
#  standby_port: "5432"
#  standby_primary_slot_name: "standby_slot"
#  s3_wal_path: "s3://mybucket/spilo/acid-minimal-cluster/abcd1234/wal/17/"

#dockerImage: ghcr.io/zalando/spilo-18:4.1-p2

env: []
#  - name: wal_s3_bucket
#    value: my-custom-bucket

envFrom: []
#  - secretRef:
#      name: my-custom-secret
#  - configMapRef:
#      name: my-custom-config

# PostgresTeam CRD resources
# Maps team IDs to additional members, teams, and superuser teams
postgresTeams: []
#  - name: acid-team
#    additionalMembers:
#      acid:
#        - extra-user1
#        - extra-user2
#    additionalTeams:
#      acid:
#        - partner-team
#    additionalSuperuserTeams:
